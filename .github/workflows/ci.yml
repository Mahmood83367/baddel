name: CI

on:
  push:
    branches: [main]
    # A release tag runs every job on the tagged commit, plus the strict
    # release-version check.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every job runs on a GitHub-hosted runner. No self-hosted runner is attached
# to this repository, so code from pull requests never runs on a private machine.
jobs:
  # Ordinary check on every pull request and push: VERSION is a semantic
  # version and is not lower than any published version. A change that does not
  # publish anything passes without raising VERSION.
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # For pull requests, check the branch's own commit, not the merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Version guard tests
        run: tools/test-check-version.sh
      - name: VERSION is not lower than any published version
        run: tools/check-version.sh

  # Strict check when a release is tagged: the tag must be v<VERSION>, and that
  # version must be published from exactly this commit. Reusing a published
  # version for different content fails here.
  release-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: |
          test "$GITHUB_REF_NAME" = "v$(tr -d '[:space:]' < VERSION)" \
            || { echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }
      - name: This version is published from this commit only
        run: tools/check-version.sh --release

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
        working-directory: macos
      - name: Test
        run: swift test
        working-directory: macos
      - name: Package (universal, ad-hoc signed)
        run: ./scripts/package-release.sh
        working-directory: macos
      - name: Check package
        run: |
          cd dist
          shasum -a 256 -c Baddel-*-macos-universal.zip.sha256
          mkdir check && ditto -x -k Baddel-*-macos-universal.zip check
          cd check/Baddel-*-macos-universal
          shasum -a 256 -c SHA256SUMS.txt
          grep -q "Copyright (c) 2026 Mahmood" LICENSE
          codesign --verify --strict Baddel.app
          lipo -archs Baddel.app/Contents/MacOS/Baddel
      - uses: actions/upload-artifact@v4
        with:
          name: baddel-macos
          path: |
            dist/Baddel-*-macos-universal.zip
            dist/Baddel-*-macos-universal.zip.sha256
          if-no-files-found: error
      # CI has no signing identity, so this package is unsigned and exists only
      # to test installing. It is uploaded under a name that says so, and it is
      # never a release asset.
      - name: Build the installer package (unsigned, test only)
        run: ./scripts/package-pkg.sh
        working-directory: macos
      - name: Install, upgrade, Open at Login and uninstall on this throwaway runner
        run: macos/scripts/pkg-install-check.sh dist/Baddel-*-TEST-ONLY-unsigned.pkg "$PWD/dist/macos-installer-checks.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-installer-TEST-ONLY-unsigned
          path: |
            dist/Baddel-*-TEST-ONLY-unsigned.pkg
            dist/Baddel-*-TEST-ONLY-unsigned.pkg.sha256
            dist/macos-installer-checks.txt
          if-no-files-found: ignore

  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test core
        run: dotnet test windows/tests/Baddel.Core.Tests/Baddel.Core.Tests.csproj
      - name: Build app
        run: dotnet build windows/src/Baddel.App/Baddel.App.csproj -c Release
      - name: Build check tool
        run: dotnet build windows/src/Baddel.WinCheck/Baddel.WinCheck.csproj -c Release
      - name: Test Windows integration layer
        run: dotnet test windows/tests/Baddel.Windows.Tests/Baddel.Windows.Tests.csproj

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Package (self-contained x64, not code-signed)
        shell: pwsh
        run: ./windows/scripts/package-release.ps1
      - name: Check package
        shell: pwsh
        run: |
          $zip = Get-Item dist/Baddel-*-windows-x64.zip
          $expected = ((Get-Content "$($zip.FullName).sha256") -split '  ')[0]
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw "zip hash mismatch" }
          Expand-Archive $zip dist/check
          $dir = (Get-ChildItem dist/check -Directory)[0].FullName
          foreach ($line in Get-Content "$dir/SHA256SUMS.txt") {
            $hash, $file = $line -split '  '
            if ((Get-FileHash "$dir/$file" -Algorithm SHA256).Hash.ToLower() -ne $hash) { throw "hash mismatch: $file" }
          }
          if (-not (Select-String -Path "$dir/LICENSE.txt" -Pattern 'Copyright \(c\) 2026 Mahmood' -Quiet)) { throw "license notice missing" }
          "PACKAGED_EXE=$dir/Baddel.exe" | Out-File $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: baddel-windows
          path: |
            dist/Baddel-*-windows-x64.zip
            dist/Baddel-*-windows-x64.zip.sha256
          if-no-files-found: error
      # The hosted runner starts with only a US English layout. This adds UK
      # English and Arabic (101 and 102) to this throwaway machine's account so
      # that switching to the exact layout can be exercised. If Windows declines,
      # the checks say which layouts were available and skip what they cannot test.
      - name: Add keyboard layouts to the runner account
        continue-on-error: true
        shell: pwsh
        run: |
          $list = New-WinUserLanguageList en-US
          $list[0].InputMethodTips.Clear(); $list[0].InputMethodTips.Add('0409:00000409')
          $list.Add('en-GB'); $list[1].InputMethodTips.Clear(); $list[1].InputMethodTips.Add('0809:00000809')
          $list.Add('ar-SA'); $list[2].InputMethodTips.Clear()
          $list[2].InputMethodTips.Add('0401:00000401'); $list[2].InputMethodTips.Add('0401:00010401')
          Set-WinUserLanguageList $list -Force
          Get-WinUserLanguageList | ForEach-Object { "$($_.LanguageTag): $($_.InputMethodTips -join ', ')" }
      - name: Desktop checks against the packaged app
        shell: pwsh
        run: |
          dotnet build windows/src/Baddel.WinCheck/Baddel.WinCheck.csproj -c Release --nologo -v q
          $tool = "windows/src/Baddel.WinCheck/bin/Release/net8.0-windows/baddel-wincheck.exe"
          $out = Join-Path $env:RUNNER_TEMP "desktop-checks.txt"
          $process = Start-Process $tool -ArgumentList "--engine", "--e2e", "`"$env:PACKAGED_EXE`"", "--out", "`"$out`"" -Wait -PassThru
          Get-Content $out
          Copy-Item $out dist/desktop-checks.txt
          exit $process.ExitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-check-results
          path: dist/desktop-checks.txt
          if-no-files-found: ignore

  # Prototype. Not a required check. The session is X11 under Xvfb with a
  # window manager; it is not a person's desktop and it is not Wayland.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install session dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xdotool openbox dbus-x11 at-spi2-core libatspi2.0-0 libatspi2.0-dev \
            libxkbcommon0 libx11-6 x11-xkb-utils xkb-data xfonts-base python3-gi gir1.2-gtk-3.0 gsettings-desktop-schemas
      - name: Test core on Linux
        run: dotnet test windows/tests/Baddel.Core.Tests/Baddel.Core.Tests.csproj
      - name: Check AT-SPI constants against the installed header
        run: python3 linux/scripts/check-atspi-constants.py
      - name: Test Linux layer
        run: dotnet test linux/tests/Baddel.Linux.Tests/Baddel.Linux.Tests.csproj
      - name: Package (self-contained x64 prototype)
        run: linux/scripts/package-release.sh
      - name: Check package
        run: |
          cd dist
          sha256sum -c Baddel-*-linux-x64-prototype.tar.gz.sha256
          mkdir check && tar -xzf Baddel-*-linux-x64-prototype.tar.gz -C check
          cd check/Baddel-*-linux-x64-prototype
          sha256sum -c SHA256SUMS.txt
          grep -q "Copyright (c) 2026 Mahmood" LICENSE
          ./baddel --version
      # The smoke test runs the binary extracted from the archive that is uploaded.
      - name: X11 smoke test of the packaged binary
        run: |
          RESULTS_FILE="$PWD/dist/linux-x11-smoke.txt" dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" \
            linux/scripts/x11-smoke.sh dist/check/Baddel-*-linux-x64-prototype/baddel
      - uses: actions/upload-artifact@v4
        with:
          name: baddel-linux-prototype
          path: |
            dist/Baddel-*-linux-x64-prototype.tar.gz
            dist/Baddel-*-linux-x64-prototype.tar.gz.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x11-smoke-results
          path: dist/linux-x11-smoke.txt
          if-no-files-found: ignore
